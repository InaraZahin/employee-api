spring:
  application:
    name: employee-api
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/employees}
    username: ${DB_USER:employees}
    password: ${DB_PASSWORD:employees}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate # the schema is owned by Flyway migrations
  flyway:
    locations: classpath:db/migration

app:
  auth:
    # Decodes to "local-development-only-change-me-in-production!". Set JWT_SECRET (base64, >= 32 bytes) everywhere else.
    jwt-secret: ${JWT_SECRET:bG9jYWwtZGV2ZWxvcG1lbnQtb25seS1jaGFuZ2UtbWUtaW4tcHJvZHVjdGlvbiE=}
    token-ttl: 1h
    # Demo accounts, created at startup if missing (username: ROLE:password). Override or remove in production.
    demo-users:
      admin: ${DEMO_ADMIN:ADMIN:Admin-Pass-2024!}
      viewer: ${DEMO_VIEWER:VIEWER:Viewer-Pass-2024!}

springdoc:
  swagger-ui:
    path: /swagger-ui.html
    operations-sorter: method

management:
  endpoints:
    web:
      exposure:
        include: health
