# Runs the API with PostgreSQL. Build the jar first: mvn -B package -DskipTests
services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: employees
      POSTGRES_USER: employees
      POSTGRES_PASSWORD: employees
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U employees -d employees"]
      interval: 3s
      timeout: 3s
      retries: 20

  api:
    build: .
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "8080:8080"
    environment:
      DB_URL: jdbc:postgresql://db:5432/employees
      DB_USER: employees
      DB_PASSWORD: employees
      # JWT_SECRET: set a base64 secret of at least 32 bytes for anything beyond local use
